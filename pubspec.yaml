name: thirukkural
description: Production-quality Thirukkural app for Android, iOS, and Web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.0
  shared_preferences: ^2.5.3
  share_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/thirukkural.json
    - assets/data/chapters.json
    - assets/images/
